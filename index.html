<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globomantics | Employee Portal</title>
<style>
:root {
  --gm-navy: #0b2545;
  --gm-blue: #13315c;
  --gm-teal: #1f9c8c;
  --gm-teal-dark: #17806f;
  --gm-bg: #f4f6f8;
  --gm-card: #ffffff;
  --gm-text: #1c2b3a;
  --gm-muted: #64748b;
  --gm-border: #e2e8f0;
  --gm-danger: #c0392b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--gm-bg);
  color: var(--gm-text);
}
.login-shell {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--gm-navy) 0%, var(--gm-blue) 55%, var(--gm-teal-dark) 100%);
  padding: 24px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--gm-card);
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(11, 37, 69, 0.35);
  padding: 40px 36px 32px;
  text-align: center;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 8px;
}
.brand svg { width: 34px; height: 34px; }
.brand-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--gm-navy);
  letter-spacing: 0.2px;
}
.login-card h1 {
  font-size: 15px;
  font-weight: 500;
  color: var(--gm-muted);
  margin: 0 0 28px;
}
.field { text-align: left; margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gm-text);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--gm-border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease;
}
.field input:focus { border-color: var(--gm-teal); }
.btn-primary {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--gm-teal);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.15s ease;
}
.btn-primary:hover { background: var(--gm-teal-dark); }
.login-footnote { margin-top: 20px; font-size: 12px; color: var(--gm-muted); }
.login-footnote a { color: var(--gm-teal-dark); text-decoration: none; }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="19" stroke="#1f9c8c" stroke-width="2" fill="#0b2545"/>
          <path d="M20 8c-6.6 0-12 5.4-12 12s5.4 12 12 12 12-5.4 12-12" stroke="#1f9c8c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <circle cx="20" cy="20" r="4" fill="#1f9c8c"/>
        </svg>
        <span class="brand-name">Globomantics</span>
      </div>
      <h1>Employee Portal Sign In</h1>

      <form id="loginForm" method="post">
        <div class="field">
          <label for="username">Work Email</label>
          <input type="text" id="username" name="username" placeholder="first.last@globomantics.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="login-footnote">
        Having trouble signing in? <a href="#">Contact IT Support</a><br>
        &copy; 2026 Globomantics Inc. Internal Use Only.
      </div>
    </div>
  </div>

  <script>document.getElementById('username').focus();</script>
</body>
</html>
